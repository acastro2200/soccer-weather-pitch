name: Run zero-paid pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 1 * *"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      USER_AGENT: soccer-weather-pitch/1.0 acastro2200@gmail.com
      DEFAULT_KICKOFF_LOCAL: "18:00"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if [ -f pyproject.toml ]; then
            python -m pip install -e .
          fi

      - name: Run tests
        run: pytest

      - name: Run pipeline
        run: |
          python -m src.pipeline \
            --teams Portugal Colombia \
            --start-date 2000-01-01 \
            --end-date "$(date +%F)" \
            --output data/output/match_conditions.csv

      - name: Upload pipeline output
        uses: actions/upload-artifact@v4
        with:
          name: soccer-weather-pitch-output
          path: data/output/
